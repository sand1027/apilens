openapi: 3.0.3
info:
  title: Sample Users API
  version: "1.0"
servers:
  - url: http://localhost:5000
paths:
  /api/users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: A list of users
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created
  /api/users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single user
        "404":
          description: Not found
